<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 大饭碗插画：首页 / 详情页 / 空状态用 -->
  <defs>
    <linearGradient id="bw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3e7c8"/>
    </linearGradient>
  </defs>
  <!-- 蒸汽 -->
  <g stroke="#e8d3ab" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M96 58 q-4 -14 2 -20"/>
    <path d="M122 54 q-2 -16 4 -22"/>
    <path d="M148 58 q-4 -14 2 -20"/>
  </g>
  <!-- 桌面阴影 -->
  <ellipse cx="120" cy="204" rx="90" ry="22" fill="#ecd9b0"/>
  <!-- 碗身 -->
  <path d="M34 156 Q120 216 206 156 L194 196 Q120 240 46 196 Z" fill="#faf4e6" stroke="#d9c39a" stroke-width="5"/>
  <path d="M46 196 Q120 240 194 196 Q120 216 46 196 Z" fill="#e8d3ab"/>
