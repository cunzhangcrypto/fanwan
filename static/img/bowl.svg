  <ellipse cx="120" cy="150" rx="86" ry="34" fill="url(#bw)" stroke="#d9c39a" stroke-width="4.5"/>
  <!-- 米饭堆 -->
  <g fill="#fdf6e3" stroke="#e8d3ab" stroke-width="1.2">
    <ellipse cx="84" cy="146" rx="20" ry="11"/>
    <ellipse cx="126" cy="140" rx="20" ry="11"/>
    <ellipse cx="164" cy="146" rx="20" ry="11"/>
    <ellipse cx="104" cy="166" rx="20" ry="11"/>
    <ellipse cx="144" cy="166" rx="20" ry="11"/>
    <ellipse cx="122" cy="156" rx="14" ry="8" fill="#fff9ec"/>
  </g>
  <!-- 筷子 -->
  <g stroke="#b98d4f" stroke-width="6" stroke-linecap="round">
    <line x1="176" y1="60" x2="192" y2="112"/>
    <line x1="196" y1="64" x2="212" y2="116"/>
  </g>
  <!-- 小辣椒 -->
  <path d="M52 78 q14 -32 32 -12 q-4 20 -22 24 Z" fill="#e23a3a"/>
  <path d="M64 88 q4 16 -6 24" stroke="#c02626" stroke-width="4" fill="none" stroke-linecap="round"/>
