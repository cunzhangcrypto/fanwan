# 饭碗儿 一键部署：push main 或手动 Run workflow 即完成
# 全部配置走 GitHub Secrets，部署者不需要本地装 wrangler / 命令行操作
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 从 GitHub Secrets 生成线上配置（D1 库 ID / Turnstile / SITE_URL / R2 桶名）
      - name: Generate prod config
        run: node scripts/gen-prod-config.mjs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # 同步 D1 表结构（4 个迁移）
      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply fanwaner --remote --config wrangler.prod.toml

      # 中文字体（OG 分享图用，约 16MB，Actions 里现下现传）
      - name: Download font
        run: npm run font:download

      - name: Upload font to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ secrets.R2_BUCKET || 'fanwaner-assets' }}/fonts/NotoSansSC-Regular.otf --file=fonts/NotoSansSC-Regular.otf

      # Worker Secrets：每次部署都同步一次（幂等，重复设没得问题）
      - name: Set worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY --name fanwaner
          echo "$SERVER_SECRET" | npx wrangler secret put SERVER_SECRET --name fanwaner
          echo "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY --name fanwaner

      # 部署 Worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.prod.toml
